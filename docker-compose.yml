version: '3.8'

networks:
  nms-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [nms-network]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nms_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nmsdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nms} -d ${POSTGRES_DB:-nmsdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [nms-network]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    restart: unless-stopped
    networks: [nms-network]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      AGENT_PORT: 2133
      AGENT_SECRET: ${AGENT_SECRET:-ab01970c-0444ff4a-7a144966-b31ca1c4}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nms}:${POSTGRES_PASSWORD:-nms_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-nmsdb}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-nms_jwt_secret_2026_change_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SNMP_DEFAULT_COMMUNITY: ${SNMP_DEFAULT_COMMUNITY:-NATIONAL852}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    ports:
      - "2133:2133"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [nms-network]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [nms-network]
    depends_on:
      - backend
      - frontend
    ports:
      - "${APP_PORT:-9090}:80"
