worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;

  # Docker internal DNS resolver
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Upstream via variables (prevents startup failure if container not running yet)
  server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Health check
    location = /health {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_set_header Host $host;
    }

    # WebSocket live feed
    location /ws/ {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Backend API
    location /api/ {
      set $backend http://backend:3001;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # Frontend (Next.js)
    location / {
      set $frontend http://frontend:3000;
      proxy_pass $frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Next.js HMR (dev only, harmless in prod)
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
